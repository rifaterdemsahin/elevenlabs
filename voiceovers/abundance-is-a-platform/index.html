<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abundance is a Platform — Voiceover Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              400: '#8aa6f9',
              500: '#6382f6',
              600: '#4f66ee',
            },
            dark: {
              950: '#07090e',
              900: '#0c1017',
              850: '#111722',
              800: '#171f2e',
              750: '#1d273a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #07090e;
      color: #e2e8f0;
      background-image:
        radial-gradient(circle at 15% 10%, rgba(99, 130, 246, 0.10) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 50% 95%, rgba(59, 130, 246, 0.07) 0%, transparent 50%);
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(17, 23, 34, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .scene-card.active {
      border-color: rgba(99, 130, 246, 0.55);
      box-shadow: 0 0 0 1px rgba(99, 130, 246, 0.25);
    }
    audio { width: 100%; }
  </style>
</head>
<body class="min-h-screen text-slate-200 antialiased selection:bg-brand-500 selection:text-white">

  <header class="border-b border-slate-800/80 glass-panel sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-500/20 ring-1 ring-white/20">
          <i data-lucide="play" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-white tracking-tight">Abundance is a Platform</h1>
          <p class="text-xs text-slate-400">Standard Adam voice · Twelve 8-second scenes</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="../day-one-how-an-llm-reads/" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-dark-850 hover:bg-dark-800 text-slate-300 border border-slate-700 transition">
          <i data-lucide="layers" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span>Day One</span>
        </a>
        <a href="../../index.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-dark-850 hover:bg-dark-800 text-slate-300 border border-slate-700 transition">
          <i data-lucide="mic" class="w-3.5 h-3.5 text-brand-400"></i>
          <span>Studio</span>
        </a>
        <a href="https://github.com/rifaterdemsahin/elevenlabs" target="_blank" rel="noopener noreferrer" class="p-2 rounded-lg bg-dark-850 hover:bg-dark-800 text-slate-400 hover:text-white border border-slate-800 transition">
          <i data-lucide="github" class="w-4 h-4"></i>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 flex flex-col gap-6">

    <section class="glass-panel rounded-2xl p-5 sm:p-6 shadow-xl flex flex-col gap-4 border border-brand-500/20">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div class="flex items-center gap-2">
          <i data-lucide="volume-2" class="w-4 h-4 text-emerald-400"></i>
          <h2 class="text-sm font-bold text-white uppercase tracking-wider">Full Voiceover</h2>
        </div>
        <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">Adam · eleven-v3</span>
      </div>
      <p class="text-sm text-slate-400">Calm, articulate explainer. ~140 words per minute. Not the cloned voice.</p>
      <audio id="fullAudio" controls preload="auto" autoplay>
        <source src="full.mp3" type="audio/mpeg">
      </audio>
      <div class="flex flex-wrap items-center gap-2">
        <button id="playFullBtn" onclick="playFull()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-brand-600 hover:bg-brand-500 text-white flex items-center gap-1.5 shadow transition">
          <i data-lucide="play" class="w-3.5 h-3.5"></i>
          <span>Play full track</span>
        </button>
        <a href="full.mp3" download="abundance-is-a-platform.mp3" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white flex items-center gap-1.5 shadow transition">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>Download MP3</span>
        </a>
        <a href="script.md" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-dark-800 hover:bg-dark-750 text-slate-300 border border-slate-700 flex items-center gap-1.5 transition">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
          <span>Script</span>
        </a>
      </div>
    </section>

    <section class="flex flex-col gap-3">
      <div class="flex items-center gap-2 px-1">
        <i data-lucide="layers" class="w-4 h-4 text-brand-400"></i>
        <h2 class="text-sm font-bold text-white uppercase tracking-wider">Scene clips</h2>
      </div>
      <div id="sceneList" class="flex flex-col gap-3"></div>
    </section>

  </main>

  <footer class="border-t border-slate-800/80 glass-panel py-4 mt-4">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2">
      <span>Abundance is a Platform · ElevenLabs via fal.ai</span>
      <a href="../../cloned-voice.html" class="text-slate-400 hover:text-white">Cloned Voice Studio</a>
    </div>
  </footer>

  <script>
    const SCENES = [
      { id: '01', time: '0:00–0:08', file: 'scene-01.mp3', text: 'Someone calls this an AI con. I walk in anyway. Abundance is a platform. The sale can still be dishonest.' },
      { id: '02', time: '0:08–0:16', file: 'scene-02.mp3', text: 'Trains were expensive. Coal plants were expensive. People still had to learn. What we do with the knowledge is the point.' },
      { id: '03', time: '0:16–0:24', file: 'scene-03.mp3', text: 'Every leap drinks power. Ask the only adult question: is this hall needed, or are the chairs just dancing?' },
      { id: '04', time: '0:24–0:32', file: 'scene-04.mp3', text: 'Software used to tax the geeks. Now the model does the legwork. Keep the tool only if it meets a real lack.' },
      { id: '05', time: '0:32–0:40', file: 'scene-05.mp3', text: 'Most people never burn the horror-story bill. A thin slice does: builders, and founders who cannot hire.' },
      { id: '06', time: '0:40–0:48', file: 'scene-06.mp3', text: 'Three ledgers: useful for me. Profitable for them. Honestly sold. Coders do not go back. That does not bless the capex.' },
      { id: '07', time: '0:48–0:56', file: 'scene-07.mp3', text: 'Trust the engineer at the wheel. Stay bound to the real world. Let the agent argue. You check the street.' },
      { id: '08', time: '0:56–1:04', file: 'scene-08.mp3', text: 'I do not send the same recruiter mail by hand. The agent sends. I still own the voice.' },
      { id: '09', time: '1:04–1:12', file: 'scene-09.mp3', text: 'Combinations explode. New work: Delivery Pilot. Forward-deployed engineer. A bigger archive makes the second brain normal.' },
      { id: '10', time: '1:12–1:20', file: 'scene-10.mp3', text: 'Taste is the scarce hour. The mundane gets trained locally. The model is glue, not a god.' },
      { id: '11', time: '1:20–1:28', file: 'scene-11.mp3', text: 'Secrets stay local. Heavy jobs go to the cloud. The meter is the product. Tokens as payments.' },
      { id: '12', time: '1:28–1:36', file: 'scene-12.mp3', text: "Price your stack. Pay the honest bill or don't. Uplift is real. And it is conditional on learning." }
    ];

    function renderScenes() {
      const list = document.getElementById('sceneList');
      list.innerHTML = SCENES.map((scene) => `
        <article id="scene-${scene.id}" class="scene-card glass-panel rounded-2xl p-4 sm:p-5 flex flex-col gap-3">
          <div class="flex items-start justify-between gap-3">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-mono font-bold text-brand-400">Scene ${scene.id}</span>
                <span class="text-[11px] text-slate-500">${scene.time}</span>
              </div>
              <p class="mt-1.5 text-sm text-slate-200 leading-relaxed">${scene.text}</p>
            </div>
            <a href="${scene.file}" download class="shrink-0 p-2 rounded-lg bg-dark-800 hover:bg-dark-750 text-slate-300 border border-slate-700" title="Download scene ${scene.id}">
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
            </a>
          </div>
          <audio controls preload="metadata" data-scene="${scene.id}" src="${scene.file}"></audio>
        </article>
      `).join('');
      lucide.createIcons();

      list.querySelectorAll('audio').forEach((el) => {
        el.addEventListener('play', () => {
          document.querySelectorAll('.scene-card').forEach((card) => card.classList.remove('active'));
          document.getElementById(`scene-${el.dataset.scene}`).classList.add('active');
          const full = document.getElementById('fullAudio');
          if (!full.paused) full.pause();
          list.querySelectorAll('audio').forEach((other) => {
            if (other !== el) other.pause();
          });
        });
      });
    }

    function playFull() {
      const full = document.getElementById('fullAudio');
      document.querySelectorAll('#sceneList audio').forEach((el) => el.pause());
      document.querySelectorAll('.scene-card').forEach((card) => card.classList.remove('active'));
      full.currentTime = 0;
      full.play().catch(() => {});
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderScenes();
      const full = document.getElementById('fullAudio');
      full.play().catch(() => {});
    });
  </script>
</body>
</html>
